<div class="page-wrapper events-page">
  <div class="container">

    <!-- Page Header -->
    <div class="events-header">

      <div>
        <h1 class="events-title">
          {{ 'EVENTS.TITLE' | translate }}
        </h1>

        <p class="events-subtitle">
          {{ events().length }}
          {{ 'EVENTS.SUBTITLE' | translate }}
        </p>
      </div>

      <a
        routerLink="/events/create"
        class="btn btn-primary"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 14 14"
          fill="none"
        >
          <path
            d="M7 1v12M1 7h12"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>

        {{ 'EVENTS.CREATE_EVENT' | translate }}
      </a>

    </div>

    <!-- Filter Component -->
    <app-event-filter
      (sportChange)="onSportChange($event)"
      (searchChange)="onSearchChange($event)"
      (statusChange)="onStatusChange($event)"

    ></app-event-filter>

    <!-- Events Grid -->
    <div class="events-grid">

      @for (event of events(); track event.id) {

        <app-event-card
          [event]="event"
        ></app-event-card>

      }

    </div>
@if (hasNext()) {
  <div class="load-more-container">
    <button
      type="button"
      class="load-more-button"
      (click)="loadMoreEvents()"
    >
      Load more
    </button>
  </div>
}
  </div>
</div>
