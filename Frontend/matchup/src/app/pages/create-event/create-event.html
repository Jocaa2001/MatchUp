<div class="page-wrapper create-event-page">
    <div class="container">

        <div class="create-header">
            <button class="back-btn" routerLink="/events">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Back
            </button>
            <div>
                <h1>Create Event</h1>
                <p>Set up your event and invite players to join.</p>
            </div>
        </div>

        <div class="create-layout">

            <!-- ── Form ── -->
            <form class="create-form" novalidate>

                <div class="form-section">
  <div class="form-section-header">
    <span class="form-section-num">01</span>
    <div>
      <h3>Sport</h3>
      <p>Select the sport for your event.</p>
    </div>
  </div>

  <div class="form-section-body">
    <div class="form-group">
      <label for="sport">
        Sport <span class="required">*</span>
      </label>

      <select id="sport" class="form-control">
        <option value="" disabled selected>
          Select a sport...
        </option>

        @for (sport of sports(); track sport.id) {
          <option [value]="sport.id">
            {{ sport.name }}
          </option>
        }
      </select>

      <span class="form-error"></span>
    </div>
  </div>
</div>

                <!-- Section: When -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="form-section-num">02</span>
                        <div>
                            <h3>When</h3>
                            <p>Schedule your event.</p>
                        </div>
                    </div>

                    <div class="form-section-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="startDate">Start Date <span class="required">*</span></label>
                                <input id="startDate" type="date" class="form-control" />
                                <span class="form-error"></span>
                            </div>
                            <div class="form-group">
                                <label for="startTime">Start Time <span class="required">*</span></label>
                                <input id="startTime" type="time" class="form-control" />
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="endDate">End Date</label>
                                <input id="endDate" type="date" class="form-control" />
                            </div>
                            <div class="form-group">
                                <label for="endTime">End Time</label>
                                <input id="endTime" type="time" class="form-control" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section: Where -->
                <div class="form-section">
                    <div class="form-section-header">
                        <span class="form-section-num">03</span>
                        <div>
                            <h3>Where</h3>
                            <p>Set the location for your event.</p>
                        </div>
                    </div>

                    <div class="form-section-body">

                        <div class="form-group">
                            <label for="locationName">
                                Location Name <span class="required">*</span>
                            </label>
                            <input id="locationName" type="text" class="form-control"
                                placeholder="e.g. Sports Hall Arena" />
                        </div>

                        <div class="form-row">

                            <div class="form-group">
                                <label for="city">
                                    City <span class="required">*</span>
                                </label>
                                <input id="city" type="text" class="form-control" placeholder="e.g. Belgrade" />
                            </div>

                            <div class="form-group">
                                <label for="address">
                                    Address <span class="required">*</span>
                                </label>
                                <input id="address" type="text" class="form-control"
                                    placeholder="e.g. Main Street 12" />
                            </div>

                        </div>


                        <div class="form-group">
                            <label for="description">
                                Description
                            </label>
                            <textarea id="description" class="form-control" rows="4"
                                placeholder="Add additional information about the location..."></textarea>
                        </div>


                        <div class="form-group">
                            <label>
                                Is this event taking place indoors?
                            </label>

                            <label class="indoor-checkbox">

                                <input type="checkbox" />
                                yes
                                <div class="checkbox-content">

                                </div>

                            </label>
                        </div>
                    </div>
                </div>

                <!-- Error Alert -->
                <div class="alert alert-error" style="display:none;">
                    Please fill in all required fields.
                </div>

                <!-- Submit -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" routerLink="/events">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-lg">
                        Create Event
                    </button>
                </div>

            </form>



        </div>
    </div>
</div>
