<div class="user-menu">

  <!-- Avatar Trigger -->
  <div class="user-trigger" (click)="toggleDropdown()">

    <!-- Sa slikom -->
    <div class="user-avatar has-image">

      @if (avatarUrl()) {
        <img
          [src]="avatarUrl()"
          [alt]="'USER_MENU.PROFILE_PICTURE' | translate"
        />
      }

    </div>

    <!-- Bez slike — inicijali -->
    <!-- <div class="user-avatar initials">MP</div> -->

    <span class="user-name">
      {{ user()?.profile?.firstName }}
    </span>

    <svg
      class="chevron"
      width="12"
      height="12"
      viewBox="0 0 12 12"
      fill="none"
    >
      <path
        d="M2 4l4 4 4-4"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

  </div>

  <!-- Dropdown -->
  @if (isOpen) {
    <app-user-menu-dropdown
      [user]="user()">
    </app-user-menu-dropdown>
  }

</div>
