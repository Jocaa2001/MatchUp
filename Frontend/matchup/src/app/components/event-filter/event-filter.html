<div class="events-filter">

  <!-- Search -->
  <div class="search-field">

    <svg
      class="search-icon"
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="none"
    >
      <circle
        cx="7"
        cy="7"
        r="5"
        stroke="currentColor"
        stroke-width="1.5"
      />

      <path
        d="M11 11l3 3"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>

      <input
        type="text"
        class="form-control"
        [placeholder]="'EVENT_FILTER.SEARCH_EVENTS' | translate"
        (input)="onSearchChange($event)"
        [value]="searchValue()"
      />

  </div>


  <!-- Filters Row -->
  <div class="filters-row">

    <!-- Sport -->
    <div class="filter-group">

      <label>
        {{ 'EVENT_FILTER.SPORT' | translate }}
      </label>

      <select class="form-control"
    [value]="selectedSportId() ?? ''"
    (change)="onSportChange($event)">

      <option value="">
    {{ 'EVENT_FILTER.ALL_SPORTS' | translate }}
  </option>

      @for (sport of sports(); track sport.id) {
        <option [value]="sport.id">
          {{ 'EVENT_FILTER.' + sport.name.toUpperCase() | translate }}
        </option>
      }

      </select>

    </div>


    <!-- Location -->
    <div class="filter-group">

      <label>
        {{ 'EVENT_FILTER.LOCATION' | translate }}
      </label>

    <select
      class="form-control"
      [value]="selectedCity() ?? ''"
      (change)="onCityChange($event)"
    >

      <option value="">
    {{ 'EVENT_FILTER.ALL_LOCATIONS' | translate }}
  </option>

      @for (city of cities(); track city.city) {
        <option [value]="city.city">
          {{ city.city }}
        </option>
      }

      </select>

    </div>


    <!-- Date -->
    <div class="filter-group">

      <label>
        {{ 'EVENT_FILTER.DATE' | translate }}
      </label>

      <div class="date-input-wrapper">

        <svg
          class="date-icon"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
        >

          <rect
            x="1.5"
            y="2.5"
            width="13"
            height="12"
            rx="2"
            stroke="currentColor"
            stroke-width="1.4"
          />

          <path
            d="M1.5 6.5h13"
            stroke="currentColor"
            stroke-width="1.4"
          />

          <path
            d="M5 1v3M11 1v3"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />

        </svg>

        <input
          type="date"
          class="form-control date-input"
          [value]="selectedDate() ?? ''"
          (change)="onDateChange($event)"
        >

      </div>

    </div>


    <!-- Status -->
    <div class="filter-group">

      <label>
        {{ 'EVENT_FILTER.STATUS' | translate }}
      </label>

      <select
        class="form-control"
        [value]="selectedStatus() ?? ''"
        (change)="onStatusChange($event)"
      >

        <option value="">
          {{ 'EVENT_FILTER.ALL' | translate }}
        </option>

      @for (status of eventStatuses; track status) {
        <option [value]="status">
          {{ status }}
        </option>
      }
          </select>

        </div>


    <!-- Clear -->
    <button class="btn btn-secondary btn-sm clear-btn" (click)="clearFilters()">

      <svg
        width="12"
        height="12"
        viewBox="0 0 12 12"
        fill="none"
      >

        <path
          d="M1 1l10 10M11 1L1 11"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />

      </svg>

      {{ 'EVENT_FILTER.CLEAR' | translate }}

    </button>

  </div>


  <!-- Active Filter Chips -->
  <div class="active-filters">

@if (selectedSportId() !== null) {
  <span class="filter-chip">

    {{ 'EVENT_FILTER.' + sports().find(sport => sport.id === selectedSportId())?.name?.toUpperCase() | translate }}

    <button (click)="clearSport()">
      ×
    </button>

  </span>
}

@if (selectedCity() !== null) {
  <span class="filter-chip">

    📍 {{ selectedCity() }}

    <button (click)="clearCity()">×</button>

  </span>
}
@if (selectedDate() !== null) {
  <span class="filter-chip">

    📅 {{ selectedDate() }}

    <button (click)="clearDate()">×</button>

  </span>
}

  </div>

</div>
